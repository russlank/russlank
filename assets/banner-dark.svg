<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="450" viewBox="0 0 800 225" role="img" aria-labelledby="title desc">
  <title id="title">Russlan Kafri — developer playground</title>
  <desc id="desc">Welcome to my little corner of GitHub. Software engineer. Curious by nature. Build, break, learn, share, repeat.</desc>
  <rect width="800" height="225" rx="12" fill="#141b24"/>

  <!-- Terminal -->
  <rect x="535" y="42" width="230" height="142" rx="9" fill="#0e141b" stroke="#34434e"/>
  <circle cx="551" cy="56" r="4" fill="#e27676"/>
  <circle cx="565" cy="56" r="4" fill="#d7b265"/>
  <circle cx="579" cy="56" r="4" fill="#75af89"/>
  <g font-family="monospace" font-size="14" xml:space="preserve">
    <text x="551" y="89" fill="#83b6ce">$ explore --ideas</text>
    <text x="551" y="112" fill="#b3c5a9">$ build --from-scratch</text>
    <text x="551" y="135" fill="#d2b98e">$ share --knowledge</text>
    <text x="551" y="158" fill="#83b6ce">$ repeat <tspan fill="#b3c5a9">_</tspan></text>
  </g>

  <!-- Introduction -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="38" y="50" fill="#92b0c4" font-size="15">Welcome to my little corner of GitHub</text>
    <text x="35" y="106" fill="#eef2f7" font-size="46" font-weight="bold">Russlan Kafri</text>
    <text x="38" y="146" fill="#b4c9dc" font-size="20">Software engineer. Curious by nature.</text>
    <text x="38" y="181" fill="#8399ac" font-size="15">Build, break, learn, share, repeat.</text>
  </g>
</svg>
