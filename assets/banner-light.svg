<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="450" viewBox="0 0 800 225" role="img" aria-labelledby="title desc">
  <title id="title">Russlan Kafri — developer playground</title>
  <desc id="desc">Welcome to my little corner of GitHub. Software engineer. Curious by nature. Build, break, learn, share, repeat.</desc>
  <rect width="800" height="225" rx="12" fill="#eef3f7"/>

  <!-- Terminal -->
  <rect x="535" y="42" width="230" height="142" rx="9" fill="#f9fbfd" stroke="#adbecb"/>
  <circle cx="551" cy="56" r="4" fill="#d66b6b"/>
  <circle cx="565" cy="56" r="4" fill="#c49a42"/>
  <circle cx="579" cy="56" r="4" fill="#63a17b"/>
  <g font-family="monospace" font-size="14" xml:space="preserve">
    <text x="551" y="89" fill="#346b87">$ explore --ideas</text>
    <text x="551" y="112" fill="#4d7048">$ build --from-scratch</text>
    <text x="551" y="135" fill="#8b672f">$ share --knowledge</text>
    <text x="551" y="158" fill="#346b87">$ repeat <tspan fill="#4d7048">_</tspan></text>
  </g>

  <!-- Introduction -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="38" y="50" fill="#4b6c82" font-size="15">Welcome to my little corner of GitHub</text>
    <text x="35" y="106" fill="#202d3a" font-size="46" font-weight="bold">Russlan Kafri</text>
    <text x="38" y="146" fill="#40586c" font-size="20">Software engineer. Curious by nature.</text>
    <text x="38" y="181" fill="#586e80" font-size="15">Build, break, learn, share, repeat.</text>
  </g>
</svg>
